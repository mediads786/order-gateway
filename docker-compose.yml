services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: order_gateway
      POSTGRES_USER: order_gateway
      POSTGRES_PASSWORD: order_gateway
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U order_gateway -d order_gateway"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://order_gateway:order_gateway@db:5432/order_gateway
      SHOPIFY_WEBHOOK_SECRET: ${SHOPIFY_WEBHOOK_SECRET:-}
      ERP_ADAPTER: ${ERP_ADAPTER:-mock}
      ERP_BASE_URL: ${ERP_BASE_URL:-http://mock_erp:9001}
      ERP_TIMEOUT_SECONDS: ${ERP_TIMEOUT_SECONDS:-5}
      ODOO_BASE_URL: ${ODOO_BASE_URL:-}
      ODOO_DB: ${ODOO_DB:-gateway}
      ODOO_API_KEY: ${ODOO_API_KEY:-}
      ODOO_EXPECTED_CURRENCY: ${ODOO_EXPECTED_CURRENCY:-USD}
      ODOO_WAREHOUSE_CODE: ${ODOO_WAREHOUSE_CODE:-WH}
      SHIPMENT_WEBHOOK_SECRET: ${SHIPMENT_WEBHOOK_SECRET:-}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      APPROVAL_THRESHOLD: ${APPROVAL_THRESHOLD:-1000.00}
      LEGACY_AUTH: ${LEGACY_AUTH:-off}
      PROPOSER: ${PROPOSER:-rule}
      DEFAULT_CURRENCY: ${DEFAULT_CURRENCY:-PKR}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      PROPOSER_MODEL: ${PROPOSER_MODEL:-claude-sonnet-5-5}
      PROPOSER_TIMEOUT_SECONDS: ${PROPOSER_TIMEOUT_SECONDS:-20}
      PROPOSAL_DAILY_LIMIT: ${PROPOSAL_DAILY_LIMIT:-50}
      PROPOSAL_TEXT_MAX_CHARS: ${PROPOSAL_TEXT_MAX_CHARS:-1000}
    ports:
      - "127.0.0.1:8002:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 2s
      timeout: 2s
      retries: 15
    depends_on:
      db:
        condition: service_healthy
  mock_erp:
    build: .
    command: ["uvicorn", "mock_erp.main:app", "--host", "0.0.0.0", "--port", "9001"]
    ports:
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9001/sales-orders')"]
      interval: 2s
      timeout: 2s
      retries: 15
  worker:
    build: .
    command: ["python", "-m", "app.workers.worker"]
    environment:
      DATABASE_URL: postgresql+psycopg://order_gateway:order_gateway@db:5432/order_gateway
      ERP_ADAPTER: ${ERP_ADAPTER:-mock}
      ERP_BASE_URL: ${ERP_BASE_URL:-http://mock_erp:9001}
      ERP_TIMEOUT_SECONDS: ${ERP_TIMEOUT_SECONDS:-5}
      ODOO_BASE_URL: ${ODOO_BASE_URL:-}
      ODOO_DB: ${ODOO_DB:-gateway}
      ODOO_API_KEY: ${ODOO_API_KEY:-}
      ODOO_EXPECTED_CURRENCY: ${ODOO_EXPECTED_CURRENCY:-USD}
      ODOO_WAREHOUSE_CODE: ${ODOO_WAREHOUSE_CODE:-WH}
      WORKER_POLL_INTERVAL_SECONDS: ${WORKER_POLL_INTERVAL_SECONDS:-1}
      RETRY_BASE_SECONDS: ${RETRY_BASE_SECONDS:-2}
      RETRY_MAX_SECONDS: ${RETRY_MAX_SECONDS:-60}
      MAX_ATTEMPTS: ${MAX_ATTEMPTS:-5}
      STALE_JOB_SECONDS: ${STALE_JOB_SECONDS:-120}
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy
      mock_erp:
        condition: service_healthy
  odoo-db:
    image: postgres:16
    profiles: ["odoo"]
    environment:
      POSTGRES_USER: ${ODOO_PG_USER:-odoo}
      POSTGRES_PASSWORD: ${ODOO_PG_PASSWORD:-odoo-dev-password}
    volumes:
      - odoo_db_data:/var/lib/postgresql/data
  odoo:
    image: ${ODOO_IMAGE:-odoo:19.0}
    profiles: ["odoo"]
    depends_on:
      - odoo-db
    environment:
      HOST: odoo-db
      USER: ${ODOO_PG_USER:-odoo}
      PASSWORD: ${ODOO_PG_PASSWORD:-odoo-dev-password}
    ports:
      - "8069:8069"
    volumes:
      - odoo_filestore:/var/lib/odoo
    command: ["odoo", "-d", "gateway", "--db-filter=^gateway$"]
volumes:
  postgres_data:
  odoo_db_data:
  odoo_filestore:
