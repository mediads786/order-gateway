services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: order_gateway
      POSTGRES_USER: order_gateway
      POSTGRES_PASSWORD: order_gateway
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U order_gateway -d order_gateway"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://order_gateway:order_gateway@db:5432/order_gateway
    ports:
      - "127.0.0.1:8002:8000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
